name: Kontroly
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Sestavení
        run: python3 build.py
      - name: Kontrola vygenerovaných souborů
        run: git diff --exit-code -- site/index.html site/sw.js site/version.json site/calltaker/index.html calltaker/web/index.html site/tts/worker.js || (echo "Vygenerované soubory neodpovídají zdrojům – spusť python3 build.py a commitni změny" && exit 1)
      - name: ESLint (nedefinované funkce)
        run: npm run lint
      - name: Testy
        run: npm test
      - name: Test v prohlížeči
        run: |
          pip install playwright && python3 -m playwright install --with-deps chromium
          python3 -m http.server -d site 8765 &
          sleep 2 && python3 tests/browser_smoke.py
