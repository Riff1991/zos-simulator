name: Release balíčku pro Mac
# Spouští se tagem vXX (např. v13). Sestaví hru, zabalí verzi pro Mac a vytvoří GitHub Release
# s poznámkami z CHANGELOG.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Kontrola verze
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || (echo "VERSION neodpovídá tagu" && exit 1)
      - name: Sestavení a balíček pro Mac
        run: python3 build.py && bash packaging/build_mac.sh
      - name: Poznámky k vydání z CHANGELOG.md
        run: awk -v v="## ${GITHUB_REF_NAME} " 'index($0,v)==1{f=1;print;next} /^## /{if(f)exit} f' CHANGELOG.md > release-notes.md && cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ZOS simulátor ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/zos-simulator-mac-${{ github.ref_name }}.zip
