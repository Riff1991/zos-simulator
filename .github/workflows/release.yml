name: Release balíčku pro Mac
# Spouští se při změně souboru VERSION na větvi main (nebo ručně). Sestaví hru, zabalí verzi pro Mac
# a vytvoří tag vXX + GitHub Release s poznámkami z CHANGELOG.md. Už vydanou verzi přeskočí.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verze
        id: v
        run: |
          echo "tag=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Už vydáno?
        id: exists
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          case "${{ steps.v.outputs.tag }}" in *-*) echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0;; esac   # testovací verze se nevydávají
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - name: Sestavení a balíček pro Mac
        if: steps.exists.outputs.skip == '0'
        run: python3 build.py && bash packaging/build_mac.sh
      - name: Poznámky k vydání z CHANGELOG.md
        if: steps.exists.outputs.skip == '0'
        run: |
          awk -v v="## ${{ steps.v.outputs.tag }} " 'index($0,v)==1{f=1;print;next} /^## /{if(f)exit} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || (echo "V CHANGELOG.md chybí sekce ${{ steps.v.outputs.tag }}" && exit 1)
      - uses: softprops/action-gh-release@v2
        if: steps.exists.outputs.skip == '0'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZOS simulátor ${{ steps.v.outputs.tag }}
          body_path: release-notes.md
          files: dist/zos-simulator-mac-${{ steps.v.outputs.tag }}.zip
